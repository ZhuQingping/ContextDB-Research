components:
  schemas:
    AdminSession:
      properties:
        user_id:
          type: string
          title: User Id
        role:
          type: string
          const: admin
          title: Role
          default: admin
        instance_id:
          type: string
          title: Instance Id
        cloud_tenant_id:
          type: string
          title: Cloud Tenant Id
      type: object
      required:
      - user_id
      - instance_id
      - cloud_tenant_id
      title: AdminSession
    ApiKeyCreate:
      properties:
        access_mode:
          type: string
          enum:
          - selected
          - all
          title: Access Mode
          default: selected
        workspace_ids:
          items:
            type: string
          type: array
          maxItems: 1000
          title: Workspace Ids
        permission:
          $ref: '#/components/schemas/Permission'
          default: read_write
        name:
          type: string
          maxLength: 64
          minLength: 1
          title: Name
      additionalProperties: false
      type: object
      required:
      - name
      title: ApiKeyCreate
    ApiKeyPatch:
      properties:
        access_mode:
          type: string
          enum:
          - selected
          - all
          title: Access Mode
        workspace_ids:
          items:
            type: string
          type: array
          maxItems: 1000
          title: Workspace Ids
        permission:
          $ref: '#/components/schemas/Permission'
      additionalProperties: false
      type: object
      required:
      - access_mode
      - workspace_ids
      - permission
      title: ApiKeyPatch
      description: Replace explicit authorization; editing can never silently grant
        write.
    ErrorResponse:
      properties:
        code:
          type: string
          title: Code
        message:
          type: string
          title: Message
        request_id:
          type: string
          title: Request Id
      type: object
      required:
      - code
      - message
      - request_id
      title: ErrorResponse
    KeyIssued:
      properties:
        key_id:
          type: string
          title: Key Id
        user_id:
          type: string
          title: User Id
        name:
          type: string
          title: Name
        access_mode:
          type: string
          enum:
          - all
          - selected
          title: Access Mode
        workspace_ids:
          items:
            type: string
          type: array
          title: Workspace Ids
        permission:
          $ref: '#/components/schemas/Permission'
        revoked_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Revoked At
        version:
          type: integer
          title: Version
        created_at:
          type: string
          format: date-time
          title: Created At
        last_used_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
