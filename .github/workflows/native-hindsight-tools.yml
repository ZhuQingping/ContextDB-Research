name: Native Hindsight deployment tools

on:
  push:
    paths:
      - 'hindsight/deployment/native-v1.0.0/**'
      - '.github/workflows/native-hindsight-tools.yml'
  pull_request:
    paths:
      - 'hindsight/deployment/native-v1.0.0/**'
      - '.github/workflows/native-hindsight-tools.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install test dependency
        run: python -m pip install 'pytest>=7,<10'
      - name: Test native renderer without Hindsight dependencies
        run: python -m pytest hindsight/deployment/native-v1.0.0/tools/tests -q -p no:cacheprovider
      - name: Check source launcher syntax
        run: bash -n hindsight/deployment/native-v1.0.0/tools/run.sh
      - name: Validate official-image Compose configuration
        env:
          NATIVE_IMAGE: ghcr.io/vectorize-io/hindsight:1.0.0-slim
          NATIVE_RUNTIME: /tmp/native-hindsight-config-check
        run: docker compose -f hindsight/deployment/native-v1.0.0/tools/compose.yaml config --quiet
